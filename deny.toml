# cargo-deny (`mise run lint-deny`, `make lint-deny`): licenses, bans, sources, advisories.

[graph]
# plasma-drop is Linux-only (KDE Plasma 6); platform-specific dependencies are checked for
# the release targets.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Every advisory kind (vulnerability, unmaintained, unsound, notice) fails unless ignored
# here with a reason.
yanked = "deny"
ignore = []

[licenses]
# What the dependency graph needs (dual-licensed crates resolve to MIT or Apache-2.0); each
# one can be combined into a GPL-3.0-or-later work. Add a license here only when a new
# dependency requires it.
allow = ["Apache-2.0", "GPL-3.0-or-later", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
