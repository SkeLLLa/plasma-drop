<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">plasma-drop icon</title>
  <desc id="desc">A large raindrop terminal mark with code-like lines for plasma-drop.</desc>
  <defs>
