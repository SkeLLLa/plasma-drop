[package]
name = "plasma-drop"
version = "1.14.0"
edition = "2024"
rust-version = "1.89"
description = "KDE Plasma 6 dropdown app launcher"
license = "GPL-3.0-or-later"
repository = "https://github.com/SkeLLLa/plasma-drop"
readme = "README.md"
keywords = ["kde", "plasma", "launcher", "dropdown", "wayland"]
categories = ["command-line-utilities"]
exclude = [
  "/.claude/",
  "/.code-review-graph/",
  "/.codex/",
  "/.github/",
  "/.gitignore",
  "/.mcp.json",
  "/.mise.toml",
  "/.zed/",
  "/AGENTS.md",
  "/Makefile",
  "/clippy.toml",
  "/docs/*/",
  "/packaging/ci/",
  "/packaging/dist/",
  "/packaging/signing/",
  "/release-plz.toml",
  "/scripts/",
  "/target/",
  "/wtq",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -3 }
nursery = { level = "warn", priority = -4 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Restriction lints (from https://github.com/morganlinton/BeautifulRust `lints/lints.toml`).
# Panics: `expect("why")` instead of `unwrap()`; a fn returning `Result` doesn't also panic.
unwrap_used = "warn"
panic_in_result_fn = "warn"
# Suppressions are `#[expect(.., reason = "..")]`, so they explain themselves and go stale loudly.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every `unsafe` block carries a `// SAFETY:` comment and does one thing.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# `Arc::clone(&x)` so cheap clones are visible; `Arc<str>` over `Arc<String>`.
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
# `From`/`TryFrom` instead of silently lossy `as`.
as_conversions = "warn"
string_add = "warn"
dbg_macro = "warn"
todo = "warn"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = [
  "fs",
  "macros",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6.1", default-features = false, features = ["proxy", "service", "tokio"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["test-util"] }

[package.metadata.deb]
maintainer = "SkeLLLa"
copyright = "2026, SkeLLLa"
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """\
plasma-drop is a KDE Plasma 6 dropdown launcher for Wayland sessions.
The package installs the binary, a user systemd unit, and an example
configuration so users can enable the service with minimal setup.
"""
assets = [
  [
    "target/release/plasma-drop",
    "usr/bin/plasma-drop",
    "755",
  ],
  [
    "packaging/systemd/plasma-drop.packaged.service",
    "usr/lib/systemd/user/plasma-drop.service",
    "644",
  ],
  [
    "resources/example-config.toml",
    "usr/share/plasma-drop/examples/config.toml",
    "644",
  ],
  [
    "README.md",
    "usr/share/doc/plasma-drop/README.md",
    "644",
  ],
  [
    "resources/icons/plasma-drop-icon.svg",
    "usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.svg",
    "644",
  ],
  [
    "resources/icons/plasma-drop-icon.png",
    "usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.png",
    "644",
  ],
  [
    "COPYING",
    "usr/share/doc/plasma-drop/COPYING",
    "644",
  ],
]

[package.metadata.generate-rpm]
summary = "KDE Plasma 6 dropdown app launcher"
license = "GPL-3.0-or-later"
assets = [
  { source = "target/release/plasma-drop", dest = "/usr/bin/plasma-drop", mode = "755" },
  { source = "packaging/systemd/plasma-drop.packaged.service", dest = "/usr/lib/systemd/user/plasma-drop.service", mode = "644", doc = false },
  { source = "resources/example-config.toml", dest = "/usr/share/plasma-drop/examples/config.toml", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/plasma-drop/README.md", mode = "644", doc = true },
  { source = "resources/icons/plasma-drop-icon.svg", dest = "/usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.svg", mode = "644", doc = true },
  { source = "resources/icons/plasma-drop-icon.png", dest = "/usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.png", mode = "644", doc = true },
  { source = "COPYING", dest = "/usr/share/doc/plasma-drop/COPYING", mode = "644", doc = true },
]
