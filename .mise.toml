[settings]
lockfile = true
http_retries = 3
pin = true
fetch_remote_versions_cache = "4h"

[settings.status]
missing_tools = "always"

[tools]
node = "26.10.0"
rg = "15.2.0"
fd = "10.5.0"
jq = "1.8.2"
yq = "4.54.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"github:jdx/packslip" = "1.6.0"
rtk = { version = "0.51.0", postinstall = "rtk init -g --claude && rtk init -g --codex" }
rust = { version = "1.99.0", components = "rust-analyzer,rust-src", mr_boxington = true }
mr-boxington = "1.16.0"
cargo-binstall = "1.25.1"
"cargo:cargo-deb" = "3.8.0"
"cargo:cargo-generate-rpm" = "0.21.0"
"github:dmtrKovalenko/fff.nvim"= { version = "0.11.0", exe = "fff-mcp", postinstall = """
command -v claude >/dev/null && claude mcp remove fff -s user 2>/dev/null; command -v claude >/dev/null && claude mcp add -s user fff -- $MISE_TOOL_INSTALL_PATH/fff-mcp --log-level warn || true; command -v codex >/dev/null && codex mcp add fff -- $MISE_TOOL_INSTALL_PATH/fff-mcp --log-level warn || true
""", platforms = { linux-x64 = { asset_pattern = "fff-mcp-x86_64-unknown-linux-musl" }, linux-arm64 = { asset_pattern = "fff-mcp-aarch64-unknown-linux-musl" }, macos-x64 = { asset_pattern = "fff-mcp-x86_64-apple-darwin" }, macos-arm64 = { asset_pattern = "fff-mcp-aarch64-apple-darwin" } } }

[tasks.build]
description = "Build the Rust project"
run = "cargo build"

[tasks.build-release]
description = "Build the optimized release binary"
run = "cargo build --release --locked"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.clippy]
description = "Alias for lint"
depends = ["lint"]

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.doc]
description = "Build crate docs with warnings denied"
run = 'RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items'

[tasks.check]
description = "Run the full quality suite"
depends = ["fmt-check", "lint", "test", "doc"]
