# OpenSSF Scorecard: publishes the score behind the README badge
# (https://scorecard.dev/viewer/?uri=github.com/SkeLLLa/plasma-drop) and the findings to code
# scanning. publish_results only accepts runs on the default branch.
name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: '27 4 * * 1'
  # Branch-Protection reads branch_protection_rule events.
  branch_protection_rule:
  workflow_dispatch:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ github.repository_owner == 'SkeLLLa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Publishing to the Scorecard API signs the results with the workflow's OIDC identity.
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
