# OpenSSF Scorecard: publishes the score behind the README badge
# (https://scorecard.dev/viewer/?uri=github.com/SkeLLLa/plasma-drop) and the findings to code
# scanning. publish_results only accepts runs on the default branch.
name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: '27 4 * * 1'
  # Branch-Protection reads branch_protection_rule events.
  branch_protection_rule:
  workflow_dispatch:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ github.repository_owner == 'SkeLLLa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Publishing to the Scorecard API signs the results with the workflow's OIDC identity.
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
