name: Release-plz

on:
  push:
    branches:
      - master

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'SkeLLLa' }}
    env:
      CARGO_TERM_COLOR: always
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Install package verification tools
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Derive release metadata
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        id: release-meta
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          VERSION="$(jq -r '.[0].version' <<< "${RELEASES}")"
          TAG_NAME="$(jq -r '.[0].tag' <<< "${RELEASES}")"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "release-plz did not report a release version" >&2
            exit 1
          fi
          if [ -z "${TAG_NAME}" ] || [ "${TAG_NAME}" = "null" ]; then
            echo "release-plz did not report a release tag" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: cargo build --release

      - name: Assemble binary distribution
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          DIST_ROOT="target/dist/plasma-drop-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "${DIST_ROOT}/bin" "${DIST_ROOT}/share/systemd/user" "${DIST_ROOT}/share/plasma-drop/examples"
          install -m 755 target/release/plasma-drop "${DIST_ROOT}/bin/plasma-drop"
          install -m 755 packaging/dist/install-user.sh "${DIST_ROOT}/install-user.sh"
          install -m 644 packaging/systemd/plasma-drop.packaged.service "${DIST_ROOT}/share/systemd/user/plasma-drop.service"
          install -m 644 resources/example-config.toml "${DIST_ROOT}/share/plasma-drop/examples/config.toml"
          install -m 644 README.md COPYING "${DIST_ROOT}/"
          tar -C target/dist -czf "target/dist/plasma-drop-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" "plasma-drop-${VERSION}-x86_64-unknown-linux-gnu"

      - name: Build deb package
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: cargo deb --no-build --output "target/debian/plasma-drop_${{ steps.release-meta.outputs.version }}_amd64.deb"

      - name: Build rpm package
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: cargo generate-rpm --target x86_64-unknown-linux-gnu --output "target/generate-rpm/plasma-drop-${{ steps.release-meta.outputs.version }}-1.x86_64.rpm"

      - name: Verify binary archive contents
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: |
          tar -tzf "target/dist/plasma-drop-${{ steps.release-meta.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz" | grep -E 'install-user.sh|bin/plasma-drop|share/systemd/user/plasma-drop.service|share/plasma-drop/examples/config.toml'

      - name: Verify deb package contents
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: |
          dpkg-deb --contents "target/debian/plasma-drop_${{ steps.release-meta.outputs.version }}_amd64.deb" | grep -E 'usr/bin/plasma-drop|usr/lib/systemd/user/plasma-drop.service|usr/share/plasma-drop/examples/config.toml'

      - name: Verify rpm package contents
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: |
          rpm -qlp "target/generate-rpm/plasma-drop-${{ steps.release-meta.outputs.version }}-1.x86_64.rpm" | grep -E '/usr/bin/plasma-drop|/usr/lib/systemd/user/plasma-drop.service|/usr/share/plasma-drop/examples/config.toml'

      - name: Upload binary distribution
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: plasma-drop-${{ steps.release-meta.outputs.version }}-x86_64-unknown-linux-gnu
          path: target/dist/plasma-drop-${{ steps.release-meta.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload deb package
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: plasma-drop-${{ steps.release-meta.outputs.version }}-deb
          path: target/debian/plasma-drop_${{ steps.release-meta.outputs.version }}_amd64.deb

      - name: Upload rpm package
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: plasma-drop-${{ steps.release-meta.outputs.version }}-rpm
          path: target/generate-rpm/plasma-drop-${{ steps.release-meta.outputs.version }}-1.x86_64.rpm

      - name: Publish release assets
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          files: |
            target/dist/plasma-drop-${{ steps.release-meta.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            target/debian/plasma-drop_${{ steps.release-meta.outputs.version }}_amd64.deb
            target/generate-rpm/plasma-drop-${{ steps.release-meta.outputs.version }}-1.x86_64.rpm

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'SkeLLLa' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
