name: Release

on:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: x86_64-unknown-linux-gnu

jobs:
  quality:
    name: Quality gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install stable Rust with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run quality checks
        run: make check

  release:
    name: Release
    needs: quality
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Bump version and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-plz update --config release-plz.toml

      - name: Commit version bump
        id: commit
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced by release-plz update"
            exit 0
          fi
          VERSION="$(awk -F '"' '/^version/ { print $2; exit }' Cargo.toml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD:master

      - name: Publish to crates.io and create GitHub release
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="${RUNNER_TEMP}/release-plz-output.json"
          release-plz release --config release-plz.toml --git-token "${GITHUB_TOKEN}" -o json | tee "${OUTPUT_FILE}"
          RELEASES="$(jq -c '.releases // []' "${OUTPUT_FILE}")"
          RELEASED="$(jq -r '((.releases // []) | length > 0)' "${OUTPUT_FILE}")"
          VERSION="$(jq -r '(.releases // [])[0].version // ""' "${OUTPUT_FILE}")"
          TAG_NAME="$(jq -r '(.releases // [])[0].tag // ""' "${OUTPUT_FILE}")"
          echo "released=${RELEASED}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "releases=${RELEASES}" >> "${GITHUB_OUTPUT}"

      - name: Install packaging tools
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Install package verification tools
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build release binary
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo build --release --locked --target "${RUST_TARGET}"

      - name: Assemble binary distribution
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.release-plz.outputs.version }}
        run: |
          DIST_ROOT="target/dist/plasma-drop-${VERSION}-${RUST_TARGET}"
          mkdir -p "${DIST_ROOT}/bin" "${DIST_ROOT}/share/systemd/user" "${DIST_ROOT}/share/plasma-drop/examples"
          install -m 755 "target/${RUST_TARGET}/release/plasma-drop" "${DIST_ROOT}/bin/plasma-drop"
          install -m 755 packaging/dist/install-user.sh "${DIST_ROOT}/install-user.sh"
          install -m 644 packaging/systemd/plasma-drop.packaged.service "${DIST_ROOT}/share/systemd/user/plasma-drop.service"
          install -m 644 resources/example-config.toml "${DIST_ROOT}/share/plasma-drop/examples/config.toml"
          install -m 644 README.md COPYING "${DIST_ROOT}/"
          tar -C target/dist -czf "target/dist/plasma-drop-${VERSION}-${RUST_TARGET}.tar.gz" "plasma-drop-${VERSION}-${RUST_TARGET}"

      - name: Build deb package
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo deb --no-build --target "${RUST_TARGET}" --output "target/debian/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb"

      - name: Build rpm package
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo generate-rpm --target "${RUST_TARGET}" --output "target/generate-rpm/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm"

      - name: Verify binary archive contents
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          tar -tzf "target/dist/plasma-drop-${{ steps.release-plz.outputs.version }}-${RUST_TARGET}.tar.gz" | grep -E 'install-user.sh|bin/plasma-drop|share/systemd/user/plasma-drop.service|share/plasma-drop/examples/config.toml'

      - name: Verify deb package contents
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          dpkg-deb --contents "target/debian/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb" | grep -E 'usr/bin/plasma-drop|usr/lib/systemd/user/plasma-drop.service|usr/share/plasma-drop/examples/config.toml'

      - name: Verify rpm package contents
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          rpm -qlp "target/generate-rpm/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm" | grep -E '/usr/bin/plasma-drop|/usr/lib/systemd/user/plasma-drop.service|/usr/share/plasma-drop/examples/config.toml'

      - name: Stage release artifacts
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        id: stage
        env:
          VERSION: ${{ steps.release-plz.outputs.version }}
        run: |
          STAGE="target/release-assets"
          mkdir -p "${STAGE}"
          cp "target/dist/plasma-drop-${VERSION}-${RUST_TARGET}.tar.gz" "${STAGE}/"
          cp "target/debian/plasma-drop_${VERSION}_amd64.deb" "${STAGE}/"
          cp "target/generate-rpm/plasma-drop-${VERSION}-1.x86_64.rpm" "${STAGE}/"
          ( cd "${STAGE}" && sha256sum -- * > SHA256SUMS )

      - name: Attest build provenance
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz
            target/release-assets/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm

      - name: Publish release assets
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-plz.outputs.tag_name }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz
            target/release-assets/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm
            target/release-assets/SHA256SUMS
