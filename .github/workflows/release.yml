name: Release

on:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: x86_64-unknown-linux-gnu

jobs:
  quality:
    name: Quality gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run quality checks
        run: make check

  release:
    name: Release
    needs: quality
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release-plz.outputs.released }}
      version: ${{ steps.release-plz.outputs.version }}
      tag_name: ${{ steps.release-plz.outputs.tag_name }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Bump version and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-plz update --config release-plz.toml

      - name: Commit version bump
        id: commit
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced by release-plz update"
            exit 0
          fi
          VERSION="$(awk -F '"' '/^version/ { print $2; exit }' Cargo.toml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD:master

      - name: Publish to crates.io and create GitHub release
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="${RUNNER_TEMP}/release-plz-output.json"
          release-plz release --config release-plz.toml --git-token "${GITHUB_TOKEN}" -o json | tee "${OUTPUT_FILE}"
          RELEASES="$(jq -c '.releases // []' "${OUTPUT_FILE}")"
          RELEASED="$(jq -r '((.releases // []) | length > 0)' "${OUTPUT_FILE}")"
          VERSION="$(jq -r '(.releases // [])[0].version // ""' "${OUTPUT_FILE}")"
          TAG_NAME="$(jq -r '(.releases // [])[0].tag // ""' "${OUTPUT_FILE}")"
          echo "released=${RELEASED}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "releases=${RELEASES}" >> "${GITHUB_OUTPUT}"

      - name: Install packaging tools
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Install package verification tools
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build release binary
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo build --release --locked --target "${RUST_TARGET}"

      - name: Assemble binary distribution
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.release-plz.outputs.version }}
        run: |
          DIST_ROOT="target/dist/plasma-drop-${VERSION}-${RUST_TARGET}"
          mkdir -p "${DIST_ROOT}/bin" "${DIST_ROOT}/share/systemd/user" "${DIST_ROOT}/share/plasma-drop/examples" "${DIST_ROOT}/resources/icons"
          install -m 755 "target/${RUST_TARGET}/release/plasma-drop" "${DIST_ROOT}/bin/plasma-drop"
          install -m 755 packaging/dist/install-user.sh "${DIST_ROOT}/install-user.sh"
          install -m 644 packaging/systemd/plasma-drop.packaged.service "${DIST_ROOT}/share/systemd/user/plasma-drop.service"
          install -m 644 resources/example-config.toml "${DIST_ROOT}/share/plasma-drop/examples/config.toml"
          install -m 644 resources/icons/plasma-drop-icon.svg "${DIST_ROOT}/resources/icons/plasma-drop-icon.svg"
          install -m 644 resources/icons/plasma-drop-icon.png "${DIST_ROOT}/resources/icons/plasma-drop-icon.png"
          install -m 644 README.md COPYING "${DIST_ROOT}/"
          tar -C target/dist -czf "target/dist/plasma-drop-${VERSION}-${RUST_TARGET}.tar.gz" "plasma-drop-${VERSION}-${RUST_TARGET}"

      - name: Build deb package
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo deb --no-build --target "${RUST_TARGET}" --output "target/debian/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb"

      - name: Build rpm package
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo generate-rpm --target "${RUST_TARGET}" --output "target/generate-rpm/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm"

      - name: Verify binary archive contents
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          archive="target/dist/plasma-drop-${{ steps.release-plz.outputs.version }}-${RUST_TARGET}.tar.gz"
          root="plasma-drop-${{ steps.release-plz.outputs.version }}-${RUST_TARGET}"
          for path in \
            "${root}/install-user.sh" \
            "${root}/bin/plasma-drop" \
            "${root}/share/systemd/user/plasma-drop.service" \
            "${root}/share/plasma-drop/examples/config.toml" \
            "${root}/README.md" \
            "${root}/resources/icons/plasma-drop-icon.svg" \
            "${root}/resources/icons/plasma-drop-icon.png"; do
            tar -tzf "${archive}" "${path}" >/dev/null
          done

      - name: Verify deb package contents
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          package="target/debian/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb"
          for path in \
            ./usr/bin/plasma-drop \
            ./usr/lib/systemd/user/plasma-drop.service \
            ./usr/share/plasma-drop/examples/config.toml \
            ./usr/share/doc/plasma-drop/README.md \
            ./usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.svg \
            ./usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.png; do
            dpkg-deb --contents "${package}" | awk '{print $6}' | grep -Fx "${path}" >/dev/null
          done

      - name: Verify rpm package contents
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          package="target/generate-rpm/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm"
          for path in \
            /usr/bin/plasma-drop \
            /usr/lib/systemd/user/plasma-drop.service \
            /usr/share/plasma-drop/examples/config.toml \
            /usr/share/doc/plasma-drop/README.md \
            /usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.svg \
            /usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.png; do
            rpm -qlp "${package}" | grep -Fx "${path}" >/dev/null
          done

      - name: Stage release artifacts
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        id: stage
        env:
          VERSION: ${{ steps.release-plz.outputs.version }}
        run: |
          STAGE="target/release-assets"
          mkdir -p "${STAGE}"
          cp "target/dist/plasma-drop-${VERSION}-${RUST_TARGET}.tar.gz" "${STAGE}/"
          cp "target/debian/plasma-drop_${VERSION}_amd64.deb" "${STAGE}/"
          cp "target/generate-rpm/plasma-drop-${VERSION}-1.x86_64.rpm" "${STAGE}/"
          (
            cd "${STAGE}"
            assets=(
              "plasma-drop-${VERSION}-${RUST_TARGET}.tar.gz"
              "plasma-drop_${VERSION}_amd64.deb"
              "plasma-drop-${VERSION}-1.x86_64.rpm"
            )
            for asset in "${assets[@]}"; do
              sha256sum -- "${asset}" > "${asset}.sha256"
            done
            sha256sum -- "${assets[@]}" > SHA256SUMS
          )

      - name: Attest build provenance
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz
            target/release-assets/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm

      - name: Publish release assets
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-plz.outputs.tag_name }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz
            target/release-assets/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz.sha256
            target/release-assets/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb.sha256
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm.sha256
            target/release-assets/SHA256SUMS

      - name: Upload package repository inputs
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-repository-inputs
          retention-days: 1
          path: |
            target/release-assets/plasma-drop_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/plasma-drop-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm

  package-repositories:
    name: Publish package repositories
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: package-repositories
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download current package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-repository-inputs
          path: target/release-assets

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y createrepo-c dpkg-dev

      - name: Build GitHub Pages package repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
          PAGES_URL: https://skellla.github.io/plasma-drop
        run: |
          set -euo pipefail

          repo_root="public"
          rpm_dir="${repo_root}/rpm/x86_64"
          deb_root="${repo_root}/deb"
          deb_pool="${deb_root}/pool/main/p/plasma-drop"
          deb_binary="${deb_root}/dists/stable/main/binary-amd64"
          previous_assets="${RUNNER_TEMP}/previous-package-assets"

          mkdir -p "${rpm_dir}" "${deb_pool}" "${deb_binary}" "${previous_assets}"

          mapfile -t previous_tags < <(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 20 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
              | grep -vxF "${TAG_NAME}" \
              | head -9 || true
          )

          for tag in "${previous_tags[@]}"; do
            tag_dir="${previous_assets}/${tag}"
            mkdir -p "${tag_dir}"
            gh release download "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern 'plasma-drop-*-1.x86_64.rpm' \
              --pattern 'plasma-drop_*_amd64.deb' \
              --dir "${tag_dir}" \
              --clobber || true
          done

          find "${previous_assets}" -type f -name '*.rpm' -exec cp -n {} "${rpm_dir}/" \;
          find "${previous_assets}" -type f -name '*.deb' -exec cp -n {} "${deb_pool}/" \;
          cp "target/release-assets/plasma-drop-${VERSION}-1.x86_64.rpm" "${rpm_dir}/"
          cp "target/release-assets/plasma-drop_${VERSION}_amd64.deb" "${deb_pool}/"

          createrepo_c --update --compatibility "${rpm_dir}"

          (
            cd "${deb_root}"
            dpkg-scanpackages --multiversion --arch amd64 pool /dev/null > dists/stable/main/binary-amd64/Packages
            gzip -9 -kf dists/stable/main/binary-amd64/Packages
          )

          write_hash_block() {
            local label="$1"
            shift
            echo "${label}:"
            for file in "$@"; do
              local hash
              local size
              case "${label}" in
                MD5Sum) hash="$(md5sum "${file}" | awk '{ print $1 }')" ;;
                SHA1) hash="$(sha1sum "${file}" | awk '{ print $1 }')" ;;
                SHA256) hash="$(sha256sum "${file}" | awk '{ print $1 }')" ;;
              esac
              size="$(wc -c < "${file}")"
              printf ' %s %16s %s\n' "${hash}" "${size}" "${file}"
            done
          }

          (
            cd "${deb_root}/dists/stable"
            {
              echo "Origin: plasma-drop"
              echo "Label: plasma-drop"
              echo "Suite: stable"
              echo "Codename: stable"
              echo "Date: $(date -Ru)"
              echo "Architectures: amd64"
              echo "Components: main"
              echo "Description: plasma-drop APT repository"
              write_hash_block MD5Sum main/binary-amd64/Packages main/binary-amd64/Packages.gz
              write_hash_block SHA1 main/binary-amd64/Packages main/binary-amd64/Packages.gz
              write_hash_block SHA256 main/binary-amd64/Packages main/binary-amd64/Packages.gz
            } > Release
          )

          cat > "${repo_root}/rpm/plasma-drop.repo" <<EOF
          [plasma-drop]
          name=plasma-drop
          baseurl=${PAGES_URL}/rpm/x86_64
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          EOF

          cat > "${deb_root}/plasma-drop.list" <<EOF
          deb [trusted=yes] ${PAGES_URL}/deb stable main
          EOF

          cat > "${repo_root}/.nojekyll" <<EOF
          EOF

          cat > "${repo_root}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>plasma-drop package repositories</title>
            </head>
            <body>
              <h1>plasma-drop package repositories</h1>
              <h2>RPM / DNF / YUM</h2>
              <pre>sudo tee /etc/yum.repos.d/plasma-drop.repo &gt;/dev/null &lt;&lt;'REPO'
          [plasma-drop]
          name=plasma-drop
          baseurl=${PAGES_URL}/rpm/x86_64
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          REPO
          sudo dnf install plasma-drop</pre>
              <h2>APT</h2>
              <pre>echo 'deb [trusted=yes] ${PAGES_URL}/deb stable main' | sudo tee /etc/apt/sources.list.d/plasma-drop.list
          sudo apt update
          sudo apt install plasma-drop</pre>
              <p>These repositories are unsigned. GitHub Releases remain the long-term artifact archive.</p>
            </body>
          </html>
          EOF

      - name: Verify generated package repositories
        run: |
          set -euo pipefail
          test -f public/rpm/x86_64/repodata/repomd.xml
          test -f public/deb/dists/stable/Release
          test -f public/deb/dists/stable/main/binary-amd64/Packages.gz
          gzip -cd public/deb/dists/stable/main/binary-amd64/Packages.gz | grep -q '^Package: plasma-drop$'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
