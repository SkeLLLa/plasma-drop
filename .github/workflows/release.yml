# Release fails closed until every action is pinned to a commit SHA (pin-gate).
name: Release

on:
  push:
    branches:
      - master

# One release at a time: a push during a release waits for it instead of cancelling it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  pin-gate:
    name: Action pin gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every action in every workflow to be pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fetch every workflow, the checker and its image list, as committed at the
          # triggering SHA; no checkout, no third-party action. Fails closed: no files, no
          # listing or any failed fetch fails the gate, and so does an unpinned action in ci.yml.
          dir="${RUNNER_TEMP}/workflows"
          mkdir -p "${dir}" "${RUNNER_TEMP}/scripts" "${RUNNER_TEMP}/packaging/ci"
          fetch() {
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/$1?ref=${GITHUB_SHA}"
          }
          names="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=${GITHUB_SHA}" \
              --jq '.[] | select(.type == "file") | select(.name | test("\\.ya?ml$")) | .name'
          )"
          if [ -z "${names}" ]; then
            echo "::error::no workflow files found at ${GITHUB_SHA}"
            exit 1
          fi
          files=()
          while IFS= read -r name; do
            case "${name}" in */* | "") echo "::error::unexpected workflow name"; exit 1 ;; esac
            fetch ".github/workflows/${name}" > "${dir}/${name}"
            files+=("${dir}/${name}")
          done <<< "${names}"
          fetch scripts/check-action-pins.sh > "${RUNNER_TEMP}/scripts/check-action-pins.sh"
          fetch packaging/ci/images.env > "${RUNNER_TEMP}/packaging/ci/images.env"
          sh "${RUNNER_TEMP}/scripts/check-action-pins.sh" "${files[@]}"

  quality:
    name: Quality gate
    needs: pin-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release workflows use no cache, so a poisoned PR cache can't reach a release build.
      - name: Install stable Rust with clippy and rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Run quality checks
        run: make check

  # Bumps the version, publishes the crate, creates the tag and the GitHub release. It builds
  # and uploads no assets: linux-assets builds them, and they go out only after sign-linux,
  # verify-linux and checksums (publish-assets).
  release:
    name: Release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      released: ${{ steps.release-plz.outputs.released }}
      version: ${{ steps.release-plz.outputs.version }}
      tag_name: ${{ steps.release-plz.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write
    steps:
      # This job pushes the version bump, so its checkout keeps the token.
      - name: Checkout repository
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Authenticate to crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0

      # Install via cargo-binstall like release-plz/action does: it picks the gnu build, while
      # install-action only ships musl builds, which fail parsing the changelog template since
      # 0.3.172 ("stack limit reached").
      - name: Install release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall release-plz@0.4.0 --strategies crate-meta-data --no-confirm
          release-plz --version

      - name: Bump version and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-plz update --config release-plz.toml

      - name: Commit version bump
        id: commit
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced by release-plz update"
            exit 0
          fi
          VERSION="$(awk -F '"' '/^version/ { print $2; exit }' Cargo.toml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD:master

      - name: Publish to crates.io and create GitHub release
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="${RUNNER_TEMP}/release-plz-output.json"
          release-plz release --config release-plz.toml --git-token "${GITHUB_TOKEN}" -o json | tee "${OUTPUT_FILE}"
          RELEASES="$(jq -c '.releases // []' "${OUTPUT_FILE}")"
          RELEASED="$(jq -r '((.releases // []) | length > 0)' "${OUTPUT_FILE}")"
          VERSION="$(jq -r '(.releases // [])[0].version // ""' "${OUTPUT_FILE}")"
          TAG_NAME="$(jq -r '(.releases // [])[0].tag // ""' "${OUTPUT_FILE}")"
          {
            echo "released=${RELEASED}"
            echo "version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "releases=${RELEASES}"
          } >> "${GITHUB_OUTPUT}"

  # --- Build (read-only) ---------------------------------------------------------------------
  # Once per architecture, on a native runner. Checksums and provenance come from the checksums
  # job, the upload from publish-assets.
  linux-assets:
    name: Linux assets (${{ matrix.arch }}-unknown-linux-gnu)
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
      DEB: plasma-drop_${{ needs.release.outputs.version }}_${{ matrix.deb_arch }}.deb
      RPM: plasma-drop-${{ needs.release.outputs.version }}-1.${{ matrix.arch }}.rpm
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}

      # Independent: tool compiles use cargo install's own temp target dir, so they don't
      # contend with the release build for the target/ lock.
      - parallel:
          - name: Install packaging tools
            run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0

          - name: Install package verification tools
            run: sudo apt-get update && sudo apt-get install -y rpm

          - name: Build release binary
            run: cargo build --release --locked --target "${TARGET}"

      - name: Assemble binary distribution
        run: |
          DIST_ROOT="target/dist/plasma-drop-${VERSION}-${TARGET}"
          mkdir -p "${DIST_ROOT}/bin" "${DIST_ROOT}/share/systemd/user" "${DIST_ROOT}/share/plasma-drop/examples" "${DIST_ROOT}/resources/icons"
          install -m 755 "target/${TARGET}/release/plasma-drop" "${DIST_ROOT}/bin/plasma-drop"
          install -m 755 packaging/dist/install-user.sh "${DIST_ROOT}/install-user.sh"
          install -m 644 packaging/systemd/plasma-drop.packaged.service "${DIST_ROOT}/share/systemd/user/plasma-drop.service"
          install -m 644 resources/example-config.toml "${DIST_ROOT}/share/plasma-drop/examples/config.toml"
          install -m 644 resources/icons/plasma-drop-icon.svg "${DIST_ROOT}/resources/icons/plasma-drop-icon.svg"
          install -m 644 resources/icons/plasma-drop-icon.png "${DIST_ROOT}/resources/icons/plasma-drop-icon.png"
          install -m 644 README.md COPYING "${DIST_ROOT}/"
          tar -C target/dist -czf "target/dist/plasma-drop-${VERSION}-${TARGET}.tar.gz" "plasma-drop-${VERSION}-${TARGET}"

      # cargo-deb and cargo-generate-rpm both read target/release/ in the asset lists as
      # target/<TARGET>/release/ under --target, and take the package architecture from it.
      - name: Build deb package
        run: cargo deb --no-build --target "${TARGET}" --output "target/debian/${DEB}"

      - name: Build rpm package
        run: cargo generate-rpm --target "${TARGET}" --output "target/generate-rpm/${RPM}"

      - name: Verify binary archive contents
        run: |
          set -euo pipefail
          archive="target/dist/plasma-drop-${VERSION}-${TARGET}.tar.gz"
          root="plasma-drop-${VERSION}-${TARGET}"
          for path in \
            "${root}/install-user.sh" \
            "${root}/bin/plasma-drop" \
            "${root}/share/systemd/user/plasma-drop.service" \
            "${root}/share/plasma-drop/examples/config.toml" \
            "${root}/README.md" \
            "${root}/resources/icons/plasma-drop-icon.svg" \
            "${root}/resources/icons/plasma-drop-icon.png"; do
            tar -tzf "${archive}" "${path}" >/dev/null
          done

      - name: Verify package contents
        env:
          ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          deb="target/debian/${DEB}"
          rpm="target/generate-rpm/${RPM}"
          test "$(dpkg-deb --field "${deb}" Architecture)" = "${DEB_ARCH}"
          test "$(rpm -qp --qf '%{ARCH}' "${rpm}")" = "${ARCH}"
          files=(
            /usr/bin/plasma-drop
            /usr/lib/systemd/user/plasma-drop.service
            /usr/share/plasma-drop/examples/config.toml
            /usr/share/doc/plasma-drop/README.md
            /usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.svg
            /usr/share/doc/plasma-drop/resources/icons/plasma-drop-icon.png
          )
          for path in "${files[@]}"; do
            dpkg-deb --contents "${deb}" | awk '{print $6}' | grep -Fx ".${path}" >/dev/null
            rpm -qlp "${rpm}" | grep -Fx "${path}" >/dev/null
          done

      # One artifact per kind and architecture; sign-linux replaces release-linux-rpm-<arch>
      # with the signed file.
      - name: Keep the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-tar-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: target/dist/plasma-drop-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz

      - name: Keep the deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-deb-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: target/debian/${{ env.DEB }}

      - name: Keep the rpm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: target/generate-rpm/${{ env.RPM }}

  # Signs the .rpm files with the subkey held in the linux-signing environment, checked against
  # the pin packaging/signing/repo.asc; without the pin (and the secret) the packages pass through
  # unsigned. The .deb carries no signature of its own: APT checks the repository's signed
  # InRelease instead (the repo job). No build runs in a job that holds the key.
  sign-linux:
    name: Sign Linux packages
    needs: [release, linux-assets]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    permissions:
      contents: read
    # The key lives only in this environment's secrets, limited to master; see
    # docs/distribution.md#linux-signing.
    environment: linux-signing
    steps:
      - name: Install git, rpm-sign and gnupg
        run: dnf install -y -q git-core rpm-sign gnupg2

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      # One directory per artifact: dist/release-linux-rpm-<arch>/.
      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-rpm-*
          path: dist

      # The key is imported, used and removed in this one step; import fails closed against
      # the pin and sets LINUX_SIGNED.
      - name: Sign the packages
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -eu
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          packaging/ci/linux-signing.sh import
          if [ -f packaging/signing/repo.asc ]; then
            packaging/ci/linux-signing.sh sign-rpm dist/*/*.rpm
          fi

      - name: Replace the x86_64 package with the signed one
        if: ${{ env.LINUX_SIGNED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm-x86_64
          retention-days: 1
          if-no-files-found: error
          overwrite: true
          path: dist/release-linux-rpm-x86_64/*.rpm

      - name: Replace the aarch64 package with the signed one
        if: ${{ env.LINUX_SIGNED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm-aarch64
          retention-days: 1
          if-no-files-found: error
          overwrite: true
          path: dist/release-linux-rpm-aarch64/*.rpm

  # Install the packages about to be published on clean systems, as users would.
  verify-linux:
    name: Verify Linux ${{ matrix.kind }} (${{ matrix.name }})
    needs: [release, sign-linux]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fedora-44, image: "fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80", kind: rpm, arch: x86_64 }
          - { name: debian-trixie, image: "debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308", kind: deb, arch: x86_64 }
          - { name: ubuntu-26.04, image: "ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944", kind: deb, arch: x86_64 }
          - { name: fedora-44-aarch64, image: "fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80", kind: rpm, arch: aarch64 }
          - { name: debian-trixie-arm64, image: "debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308", kind: deb, arch: aarch64 }
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.kind }}-${{ matrix.arch }}
          path: dist

      # As dnf checks it with gpgcheck=1, against the committed key rather than the one used.
      - name: Check the package signature
        if: ${{ matrix.kind == 'rpm' }}
        run: |
          if [ -f packaging/signing/repo.asc ]; then
            dnf install -y -q gnupg2
            packaging/ci/linux-signing.sh check-rpm dist/*.rpm
          else
            echo "packaging/signing/repo.asc is not committed: the package is unsigned"
          fi

      - name: Install and run
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -eu
          if [ "${KIND}" = rpm ]; then
            dnf install -y -q ./dist/*.rpm
          else
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/*.deb
          fi
          plasma-drop --version
          plasma-drop print-example-config > /dev/null
          test -f /usr/lib/systemd/user/plasma-drop.service

  # Every asset is hashed and attested after it is built and verified, so SHA256SUMS lists
  # exactly the signed files that publish-assets uploads.
  checksums:
    name: Checksums and provenance
    needs: [release, sign-linux, verify-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write checksums
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            "plasma-drop-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "plasma-drop-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "plasma-drop_${VERSION}_amd64.deb"
            "plasma-drop_${VERSION}_arm64.deb"
            "plasma-drop-${VERSION}-1.x86_64.rpm"
            "plasma-drop-${VERSION}-1.aarch64.rpm"
          )
          for f in "${expected[@]}"; do
            test -f "${f}" || { echo "::error::${f} is missing"; exit 1; }
            sha256sum -- "${f}" > "${f}.sha256"
          done
          if [ "$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -ne "${#expected[@]}" ]; then
            echo "::error::unexpected files in release-assets"
            ls -la
            exit 1
          fi
          sha256sum -- "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.deb
            release-assets/*.rpm

      # publish-assets merges these with the assets; the name must not match release-*.
      - name: Keep the checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          retention-days: 1
          if-no-files-found: error
          path: |
            release-assets/*.sha256
            release-assets/SHA256SUMS

  publish-assets:
    name: Publish release assets
    needs: [release, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the assets and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          assets=(
            "plasma-drop-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "plasma-drop-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "plasma-drop_${VERSION}_amd64.deb"
            "plasma-drop_${VERSION}_arm64.deb"
            "plasma-drop-${VERSION}-1.x86_64.rpm"
            "plasma-drop-${VERSION}-1.aarch64.rpm"
          )
          files=("${assets[@]}" SHA256SUMS)
          for f in "${assets[@]}"; do files+=("${f}.sha256"); done
          gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber

  packslip:
    name: Sign packslip manifest
    needs: [release, publish-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signing never holds release-write access; publish-packslip uploads the bundle.
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag sits on the release-plz version-bump commit, not on github.sha (the push that
      # triggered this run), so record the commit the tag actually names.
      - name: Resolve tagged commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_NAME}" --jq .sha)" >> "${GITHUB_OUTPUT}"

      # Signs the tarballs already attached to the release, so one manifest covers exactly
      # what users download, one linux/<arch> entry each. The checksums job attested them,
      # hence attest: link.
      - name: Sign packslip manifest
        id: packslip
        uses: jdx/packslip@7d397618045bd98b76cd5cb8177767b2f52789b8 # v1.10.1
        with:
          download: plasma-drop-*-unknown-linux-gnu.tar.gz
          bin: plasma-drop
          tag: ${{ needs.release.outputs.tag_name }}
          version: ${{ needs.release.outputs.version }}
          commit: ${{ steps.source.outputs.commit }}
          attest: link
          upload: false

      - name: Keep signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip-bundle
          retention-days: 1
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    name: Publish packslip manifest
    needs: [release, packslip]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch signed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip

      - name: Upload signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "${TAG_NAME}" packslip/packslip.sigstore.json --repo "${GITHUB_REPOSITORY}" --clobber

  verify-packslip:
    name: Verify published packslip manifest
    needs: [release, publish-packslip]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Signer fingerprint published in README.md; constant across releases.
      PACKSLIP_PIN: ps1_4yd5vxao3lfzaox72lynxuotke
    steps:
      - name: Install packslip
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: packslip@1.6.0

      # Check what users download: the public release URLs, not this run's local files.
      - name: Verify manifest against published tarballs
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          args=()
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            asset="plasma-drop-${VERSION}-${target}.tar.gz"
            curl -fsSLO --retry 3 "${base}/${asset}"
            args+=(--artifact "${asset}")
          done
          curl -fsSLO --retry 3 "${base}/packslip.sigstore.json"
          packslip verify packslip.sigstore.json \
            --identity-prefix "https://github.com/${GITHUB_REPOSITORY}/" \
            --issuer https://token.actions.githubusercontent.com \
            --pin "${PACKSLIP_PIN}" \
            "${args[@]}"

  # The APT and DNF repositories on GitHub Pages (Settings → Pages → Source: GitHub Actions):
  # packaging/ci/pages-repo.sh builds them from this run's verified .deb and .rpm plus those of
  # the 9 releases before it, since each deploy replaces the site. Unsigned until
  # packaging/signing/repo.asc is committed; from then on the metadata and every .rpm are
  # signed with that key, and the release fails without it (docs/distribution.md#linux-signing).
  # PAGES_BASE_URL overrides the URL for a custom domain. This job holds the signing key and
  # builds the site; `pages` only deploys it.
  repo:
    name: Build APT and DNF repositories
    needs: [release, publish-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Trixie's rpm (4.20, Sequoia) reads a pin with revoked subkeys; the runner's 4.18 can't.
    container: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    # In a container, run steps default to sh (dash); these use mapfile and ${var,,}.
    defaults:
      run:
        shell: bash
    environment: linux-signing
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
    steps:
      # rpm for rpmsign and rpmkeys, which also sign the earlier releases' .rpm files.
      - name: Install git, gh, apt-ftparchive, createrepo_c and rpm
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git gh gnupg apt-utils createrepo-c rpm

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Fetch this release's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-{deb,rpm}-*
          path: assets
          merge-multiple: true

      # The 9 releases before this one, so users can still pin or downgrade.
      - name: Fetch earlier releases' packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 30 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
              grep -vxF "${TAG_NAME}" | head -n 9 || true
          )
          for tag in "${tags[@]}"; do
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir assets --skip-existing \
              --pattern 'plasma-drop_*_amd64.deb' --pattern 'plasma-drop_*_arm64.deb' \
              --pattern 'plasma-drop-*-1.x86_64.rpm' --pattern 'plasma-drop-*-1.aarch64.rpm' ||
              echo "${tag}: no Linux packages"
          done
          ls -l assets

      # import fails closed against the pin, as in sign-linux, and sets LINUX_SIGNED.
      - name: Build the repositories
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          packaging/ci/linux-signing.sh import
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="${PAGES_BASE_URL:-https://${owner}.github.io/${GITHUB_REPOSITORY#*/}}"
          packaging/ci/pages-repo.sh assets site "${base}" "${VERSION}"

      - name: Verify the repositories
        run: |
          set -euo pipefail
          for f in index.html deb/index.html rpm/index.html deb/dists/stable/Release \
            deb/plasma-drop.list rpm/plasma-drop.repo \
            rpm/x86_64/repodata/repomd.xml rpm/aarch64/repodata/repomd.xml \
            deb/dists/stable/main/binary-amd64/Packages.gz deb/dists/stable/main/binary-arm64/Packages.gz; do
            test -s "site/${f}"
          done
          # No `grep -q`: it exits on the first match, gzip dies of SIGPIPE, pipefail fails.
          for arch in amd64 arm64; do
            gzip -cd "site/deb/dists/stable/main/binary-${arch}/Packages.gz" |
              grep -Ex "Version: ${VERSION}(-[0-9]+)?" > /dev/null
          done
          if [ "${LINUX_SIGNED}" = "true" ]; then
            test -s site/plasma-drop.asc
            test -s site/deb/dists/stable/InRelease
            test -s site/rpm/x86_64/repodata/repomd.xml.asc
            test -s site/rpm/aarch64/repodata/repomd.xml.asc
            grep -qx gpgcheck=1 site/rpm/plasma-drop.repo
            packaging/ci/linux-signing.sh check-rpm site/rpm/*/*.rpm
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: Publish APT and DNF repositories (GitHub Pages)
    needs: repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
